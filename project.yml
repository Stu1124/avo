name: Avo
include:
  # Developer ID archive settings, scoped to the Avo target. scripts/release.sh exports
  # AVO_RELEASE=true before `xcodegen generate`; see project-release.yml for why they are not
  # xcodebuild command-line settings.
  - path: project-release.yml
    enable: ${AVO_RELEASE}
options:
  bundleIdPrefix: app.avo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signing. Local builds sign ad-hoc so no Apple Developer account is required.
    # Set AVO_TEAM_ID before `xcodegen generate`; set AVO_CODE_SIGN_IDENTITY to sign with a real
    # certificate. Everything that names a team or an identity is scoped to the Avo target below,
    # so it never reaches the SwiftMath package target.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Avo:
    type: application
    platform: macOS
    sources:
      - path: Avo
        excludes: ["**/*.md", "Resources/**"]
      - path: Avo/Resources/Assets.xcassets
        buildPhase: resources
      - path: Avo/Resources/Avo.icns
        buildPhase: resources
    info:
      path: Avo/Info.plist
      properties:
        CFBundleName: Avo
        CFBundleDisplayName: Avo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: Avo
        NSMicrophoneUsageDescription: Avo listens while you hold your talk key.
        NSSpeechRecognitionUsageDescription: Avo transcribes your voice on this Mac.
        NSRemindersFullAccessUsageDescription: Avo reads and creates your reminders.
        NSCalendarsFullAccessUsageDescription: Avo reads your calendars.
        NSAppleEventsUsageDescription: Avo sends iMessages and controls other apps at your request.
        NSLocationUsageDescription: Avo uses your location for nearby requests.
        NSLocationWhenInUseUsageDescription: Avo uses your location for nearby requests.
        CFBundleURLTypes:
          - CFBundleURLName: app.avo.mac
            CFBundleURLSchemes: [avo]
    entitlements:
      path: Avo/Avo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.device.audio-input: true
    dependencies:
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.avo.mac
        GENERATE_INFOPLIST_FILE: NO
        # The signing identity, scoped to this target. scripts/install.sh passes
        # AVO_CODE_SIGN_IDENTITY=... to xcodebuild as a plain user-defined setting; only this line
        # turns it into CODE_SIGN_IDENTITY, and only for the app. Passing CODE_SIGN_IDENTITY on the
        # xcodebuild command line instead would apply to every target in the build, including the
        # SwiftMath package, which then fails to sign. With nothing set it falls back to ad-hoc.
        CODE_SIGN_IDENTITY: "$(AVO_CODE_SIGN_IDENTITY:default=-)"
        # Read from the environment at `xcodegen generate` time, and target-scoped for the same
        # reason as the identity above. Empty when AVO_TEAM_ID is unset, which is what an ad-hoc
        # build wants.
        DEVELOPMENT_TEAM: "${AVO_TEAM_ID}"
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    from: 1.7.3
schemes:
  Avo:
    build:
      targets: {Avo: all}
    run:
      config: Debug

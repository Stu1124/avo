# Merged into project.yml when AVO_SIGNED=true. Set that only when your team has a provisioning
# profile for app.avo.mac; it is deliberately not derived from AVO_TEAM_ID (see scripts/install.sh).
#
# The data-protection keychain grants access by team-prefixed group instead of by the exact binary
# that wrote the item, so rebuilding never raises a Keychain access prompt (Avo/Support/Keychain.swift
# explains why that matters for a windowless agent). It needs this entitlement, and this entitlement
# needs a provisioning profile — hence the opt-in. Ad-hoc builds ship without it and use the legacy
# keychain; nothing else changes.
targets:
  Avo:
    entitlements:
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)app.avo.mac"]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
